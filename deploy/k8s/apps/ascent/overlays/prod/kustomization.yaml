apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Ascent (Fitness-App) gibt es nur als prod, ein dev-Namespace lohnt sich auf dem Pi nicht
namespace: ascent

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: backup-patch.yaml

configMapGenerator:
  - name: app-config
    literals:
      - ASPNETCORE_ENVIRONMENT=Production
      - Keycloak__Authority=https://auth.chrispicloud.dev/realms/ascent
      - Keycloak__Audience=ascent-api
      - Keycloak__ClientId=ascent-web

# Secrets werden von Hand im Cluster angelegt (nicht in git):
#   kubectl -n ascent create secret generic postgres-credentials \
#     --from-literal=POSTGRES_USER=ascent --from-literal=POSTGRES_PASSWORD=... --from-literal=POSTGRES_DB=ascent
#   kubectl -n ascent create secret generic app-secrets \
#     --from-literal=ConnectionStrings__Ascent="Host=postgres;Port=5432;Database=ascent;Username=ascent;Password=..."
#   kubectl -n ascent create secret docker-registry ghcr-credentials \
#     --docker-server=ghcr.io --docker-username=dreyssechris --docker-password=<PAT>
#   r2-credentials für den Backup-Upload wie in choam-prod (R2_ENDPOINT, R2_BUCKET, AWS_*)

images:
  - name: ghcr.io/dreyssechris/ascent
    newTag: v0.1.0
